<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сообщения</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <header id="header" class="header" role="banner">
        <h1 class="visually-hidden">Сообщения</h1>
    </header>

    <main class="container mt-5">
        <section>
            <h1 class="text-center" id="messages-heading">История сообщений</h1>
            <div class="property-title" id="propertyTitle">
                <a href="#" class="property-link" id="propertyLink">Название недвижимости</a>
            </div>
            <div id="messageList" class="messages-container">
            </div>
        </section>

        <section>
            <h3 class="mt-5">Отправить новое сообщение</h3>
            <form id="sendMessageForm" onsubmit="return sendMessage(event)" aria-labelledby="sendMessageForm">
                <div class="mb-3">
                    <label for="messageText" class="form-label"></label>
                    <textarea class="form-control" id="messageText" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Отправить сообщение</button>
                <button type="button" class="btn btn-secondary" onclick="cancelMessage()">Отменить</button>
            </form>
        </section>
    </main>
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Авторизация</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <form id="modalLoginForm">
                        <div class="mb-3">
                            <label for="modalEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="modalEmail" placeholder="Введите email" required>
                        </div>
                        <div class="mb-3">
                            <label for="modalPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="modalPassword" placeholder="Введите пароль" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Войти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <footer id="footer" class="footer" role="contentinfo" aria-label="Подвал сайта"></footer>

    <script src="js/layout.js"></script>
    <script src="js/messages.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
