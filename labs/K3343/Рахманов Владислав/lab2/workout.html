<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренировка</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 id="workoutTitle">Название тренировки</h2>
        <div class="embed-responsive embed-responsive-16by9 mb-4">
            <iframe id="workoutVideo" class="embed-responsive-item" src="https://rutube.ru/video/323abdb700d0102fba48bbbc163ac472/" allowfullscreen></iframe>
        </div>
        <h3>Описание</h3>
        <h3>Длительность: <span id="workoutDuration">15 минут</span></h3>
        <h3>Уровень: <span id="workoutLevel">Новичок</span></h3>
        <h3>Тип: <span id="workoutType">Кардио</span></h3>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="scripts/workout.js"></script>
</body>
</html>
