<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <label class="switch" for="theme-toggle" aria-label="Переключатель темы">
        <input type="checkbox" id="theme-toggle" aria-checked="false" role="switch">
        <span class="slider round"></span>
        <span class="ml-2">Тёмная тема</span>
    </label>
    <div class="container mt-5" role="main">
        <h2 id="login-heading">Вход</h2>
        <form id="loginForm" aria-labelledby="login-heading">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Введите email" aria-required="true">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" class="form-control" id="password" placeholder="Введите пароль" aria-required="true">
            </div>
            <button type="submit" class="btn btn-primary" id="loginButton">Войти</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/switch.js"></script>
</body>
</html>
