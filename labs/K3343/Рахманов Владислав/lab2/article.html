<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статья</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5" role="main">
        <!-- Добавлен tabindex для заголовка, чтобы улучшить доступность -->
        <h2 id="articleTitle" tabindex="0">Название статьи</h2>
        <div class="mt-3">
            <!-- Добавлен aria-live для динамического контента -->
            <p id="articleContent" aria-live="polite"></p>
        </div>
    </div>
    <!-- Добавлен label для переключателя темы с ARIA-атрибутами -->
    <label class="switch" for="theme-toggle" aria-label="Переключатель темы">
        <input type="checkbox" id="theme-toggle" aria-checked="false" role="switch">
        <span class="slider round"></span>
        <span class="ml-2">Тёмная тема</span>
    </label>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="scripts/article.js"></script>
    <script src="scripts/switch.js"></script>
</body>
</html>
