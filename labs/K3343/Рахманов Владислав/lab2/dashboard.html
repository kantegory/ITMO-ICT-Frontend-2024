<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Личный кабинет</h2>
        <div class="dashboard-container">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Трекинг прогресса</h5>
                    <p class="card-text" id="progressContainer">Кардио: 0/0, Силовые: 0/0</p>
                </div>
            </div>
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Планы тренировок</h5>
                    <p class="card-text" id="plansContainer">Ваши тренировочные планы...</p>
                    <form id="plansForm">
                        <div class="form-group">
                            <label for="cardioCount">Количество кардио тренировок за месяц:</label>
                            <input type="number" class="form-control" id="cardioCount" min="0">
                        </div>
                        <div class="form-group">
                            <label for="completedCardio">Завершенные кардио тренировки:</label>
                            <input type="number" class="form-control" id="completedCardio" min="0">
                        </div>
                        <div class="form-group">
                            <label for="strengthCount">Количество силовых тренировок за месяц:</label>
                            <input type="number" class="form-control" id="strengthCount" min="0">
                        </div>
                        <div class="form-group">
                            <label for="completedStrength">Завершенные силовые тренировки:</label>
                            <input type="number" class="form-control" id="completedStrength" min="0">
                        </div>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="scripts/dashboard.js"></script>
</body>
</html>
