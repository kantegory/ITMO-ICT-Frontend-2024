<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ресторан</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="labs/css/theme-style.css">
</head>
<body>

<header>
    <nav>
        <div class="main">
            <a href="main.html">Бронь столиков Букин</a>
            <button id="themeToggle" class="btn btn-primary">Переключить тему</button>
        </div>
    </nav>
</header>

<main>
    <section id="restaurant-details">
        <div class="container">
            <h2 id="restaurant-name" class="text-center mb-4">Загрузка...</h2>
            <div class="row">
                <div class="col-md-6">
                    <img id="restaurant-image" src="images/loading.jpg" class="card-img-top" alt="Загрузка...">
                </div>
                <div class="col-md-6">
                    <p id="restaurant-description">Загрузка информации о ресторане...</p>
                    <h3>Меню</h3>
                    <ul id="restaurant-menu">
                        <li>Загрузка...</li>
                    </ul>
                    <p><strong>Часы работы:</strong> <span id="restaurant-hours">Загрузка...</span></p>
                    <p><strong>Адрес:</strong> <span id="restaurant-address">Загрузка...</span></p>
                    <button class="btn btn-primary" data-toggle="modal" data-target="#bookingModal">Забронировать столик</button> 
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Модальное окно бронирования -->
<div class="modal fade" id="bookingModal" tabindex="-1" role="dialog" aria-labelledby="bookingModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="bookingModalLabel">Бронирование столика</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="bookingForm">
                    <div class="form-group">
                        <label for="date">Дата</label>
                        <input type="date" id="date" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="time">Время</label>
                        <input type="time" id="time" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="guests">Количество гостей</label>
                        <input type="number" id="guests" class="form-control" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Забронировать</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = "http://localhost:5502";

    function getRestaurantIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get("id");
    }

    async function loadRestaurant() {
        const restaurantId = getRestaurantIdFromUrl();
        if (!restaurantId) {
            document.getElementById("restaurant-name").innerText = "Ресторан не найден";
            return;
        }

        try {
            const response = await fetch(`${API_URL}/restaurants?id=${restaurantId}`);
            if (!response.ok) throw new Error("Ошибка загрузки данных");

            const data = await response.json();
            if (data.length === 0) {
                document.getElementById("restaurant-name").innerText = "Ресторан не найден";
                return;
            }

            const restaurant = data[0];

            document.getElementById("restaurant-name").innerText = restaurant.name;
            document.getElementById("restaurant-image").src = restaurant.image;
            document.getElementById("restaurant-image").alt = restaurant.name;
            document.getElementById("restaurant-description").innerText = `Добро пожаловать в ресторан "${restaurant.name}"! Насладитесь ${restaurant.cuisine} кухней в уютной атмосфере.`;
            document.getElementById("restaurant-hours").innerText = restaurant.working_hours;
            document.getElementById("restaurant-address").innerText = restaurant.address;

            const menuList = document.getElementById("restaurant-menu");
            menuList.innerHTML = "";
            restaurant.menu.forEach(item => {
                const li = document.createElement("li");
                li.innerText = item;
                menuList.appendChild(li);
            });

        } catch (error) {
            console.error("Ошибка загрузки ресторана:", error);
            document.getElementById("restaurant-name").innerText = "Ошибка загрузки данных";
        }
    }

    document.addEventListener("DOMContentLoaded", loadRestaurant);

    document.getElementById("bookingForm").addEventListener("submit", async (event) => {
        event.preventDefault();

        const restaurantId = getRestaurantIdFromUrl();
        const userId = localStorage.getItem("userId") || 1;
        const date = document.getElementById("date").value;
        const time = document.getElementById("time").value;
        const guests = document.getElementById("guests").value;

        console.log("Форма отправлена, данные:", { userId, restaurantId, date, time, guests });

        const result = await bookTable(userId, restaurantId, date, time, guests);

        if (result) {
            alert("Бронирование успешно отправлено!");
            $("#bookingModal").modal("hide");
        } else {
            alert("Ошибка бронирования!");
        }
    });

    async function bookTable(userId, restaurantId, date, time, guests) {
        const bookingData = { userId, restaurantId, date, time, guests, status: "Ожидание" };
        
        console.log("Отправка бронирования:", bookingData);

        const response = await fetch(`${API_URL}/bookings`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(bookingData)
        });

        console.log("Статус ответа сервера:", response.status);

        if (!response.ok) return false;

        const result = await response.json();
        console.log("Ответ сервера:", result);

        return result;
    }

    document.addEventListener("DOMContentLoaded", function() {
        const themeToggle = document.getElementById("themeToggle");
        const body = document.body;

        const savedTheme = localStorage.getItem("theme");
        if (savedTheme) {
            body.classList.add(savedTheme);
        } else {
            body.classList.add("light-theme");
        }

        themeToggle.addEventListener("click", function() {
            if (body.classList.contains("light-theme")) {
                body.classList.remove("light-theme");
                body.classList.add("dark-theme");
                localStorage.setItem("theme", "dark-theme");
            } else {
                body.classList.remove("dark-theme");
                body.classList.add("light-theme");
                localStorage.setItem("theme", "light-theme");
            }
        });
    });

</script>

</body>
</html>
