<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/messages.css">
    <script src="../js/check-auth.js"></script>
    <script defer src="../js/layout.js"></script>
    <script defer src="../js/theme-switch.js"></script> 
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/messages.js"></script>
</head>

<body>
    <header id="header-container" role="banner">
        <h1 class="sr-only">Messages</h1>
    </header>

    <main role="main" class="container">
        <section class="dialog-list" aria-labelledby="dialogSection">
            <h2 id="dialogSection" class="sr-only">Dialogs</h2>
            <ul id="dialogs" role="list" aria-live="polite">
                <!-- Dynamic Content  -->
            </ul>
        </section>

        <section class="message-container" id="message-container" aria-labelledby="chatHeader">
            <h2 id="chatHeader" aria-live="polite">Chat with <span id="chat-owner">Select a dialog</span></h2>

            <div class="messages" id="messages" role="region" aria-live="polite"></div>

            <div class="message-input">
                <label for="message-input" class="sr-only"></label>
                <input type="text" placeholder="Type your message here..." id="message-input" aria-label="Message input">
                <button type="button" onclick="sendMessage(event)" aria-label="Send message">Send</button>
            </div>
        </section>
    </main>
</body>

</html>
