<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile info</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/profile.css">
    <script src="../js/check-auth.js"></script>
    <script src="../js/logout.js"></script>
    <script defer src="../js/layout.js"></script> 
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/profile.js"></script>
</head>

<body>
    <div id="header-container" role="banner"></div>

    <main role="main" class="container">

        <div class="row">
            
            <div id="content" class="content content-full-width">
                <section class="profile" aria-labelledby="profileSection">
                    <div class="profile-header">
                        <div class="profile-header-cover" aria-hidden="true"></div>
                        <div class="profile-header-content">

                            <!-- Default mock data -->
                            <div class="profile-header-img">
                                <img src="../media/profile/anon.jpg" alt="Profile picture of the user">
                            </div>
                            
                            <div class="profile-header-info">
                                <h4 id="profileSection" class="sr-only">User Profile</h4>
                                <p aria-live="polite">None</p>
                                <button class="edit-profile" aria-label="Edit your profile information">Edit Profile</button>
                                <button class="logout" aria-label="Log out of your account">Log out</button>
                            </div>
                            
                        </div>
                    </div>
                </section>
                
                <section class="profile-content" aria-labelledby="rentalHistorySection">
                    <div class="tab-content page-0">
                        <div class="tab-pane fade active show" id="profile-post">
                            <ul class="timeline" id="rentalHistoryContainer" aria-live="polite" role="list"></ul>
                            <div id="noDataMessage" class="no-data-message" style="display:none;">
                                <p>No rental history found.</p>
                            </div>
                        </div>
                    </div>
                </section>
                
            </div>
        </div>
    </main>
</body>

</html>
