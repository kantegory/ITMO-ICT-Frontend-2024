<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth form</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script type="module" defer src="../js/auth.js"></script>
    <script defer src="../js/layout.js"></script> 
    <script defer src="../js/theme-switch.js"></script> 
</head>

<body>
    <header id="header-container" role="banner">
        <h1 class="sr-only">Authentication Form</h1>
    </header>

    <main role="main" class="form-container">

        <button class="form-close" aria-label="Close Authentication Form">
            <i class="uil uil-times"></i>
        </button>

        <section class="form login-form" aria-labelledby="loginFormTitle">

            <form action="#" aria-labelledby="loginFormTitle">
                <h2 id="loginFormTitle">Login</h2>

                <div class="input-box">
                    <input type="email" id="login-email" name="email" placeholder="Enter your email" required aria-required="true" />
                    <i class="uil uil-envelope-alt email"></i>
                </div>

                <div class="input-box">
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" required aria-required="true" />
                    <i class="uil uil-lock password"></i>
                    <i class="uil uil-eye-slash pw-hide"></i>
                </div>

                <div class="option-field">
                    <span class="checkbox">
                        <input type="checkbox" id="check" />
                        <label for="check">Remember me</label>
                    </span>
                    <a href="#" class="forgot-pw" aria-label="Forgot your password?">Forgot password?</a>
                </div>

                <button type="submit" class="button login" aria-label="Login now">Login Now</button>

                <div class="login-signup">Don't have an account? <a href="#" id="signup" aria-label="Go to Signup form">Signup</a></div>
            </form>
        </section>

        <section class="form signup-form" aria-labelledby="signupFormTitle">

            <form action="#" aria-labelledby="signupFormTitle">
                <h2 id="signupFormTitle">Signup</h2>

                <div class="input-box">
                    <input type="email" id="reg-email" name="reg-email" placeholder="Enter your email" required aria-required="true" />
                    <i class="uil uil-envelope-alt email"></i>
                </div>

                <div class="input-box">
                    <input type="password" id="reg-password" name="reg-password" placeholder="Create password" required aria-required="true" />
                    <i class="uil uil-lock password"></i>
                    <i class="uil uil-eye-slash pw-hide"></i>
                </div>

                <div class="input-box">
                    <input type="password" id="reg-confirm-password" name="reg-confirm-password" placeholder="Confirm password" required aria-required="true" />
                    <i class="uil uil-lock password"></i>
                    <i class="uil uil-eye-slash pw-hide"></i>
                </div>

                <div class="input-box">
                    <input type="text" id="reg-name" name="reg-name" placeholder="Enter your full name" required aria-required="true" />
                    <i class="uil uil-user name"></i>
                </div>
        
                <div class="input-box">
                    <input type="text" id="reg-status" name="reg-status" placeholder="Enter your status (e.g., Photographer)" required aria-required="true" />
                    <i class="uil uil-info-circle status"></i>
                </div>

                <button type="submit" class="button signup" aria-label="Signup now">Signup Now</button>
                
                <div class="login-signup">Already have an account? <a href="#" id="login" aria-label="Go to Login form">Login</a></div>
            </form>
        </section>
    </main>
</body>
</html>
