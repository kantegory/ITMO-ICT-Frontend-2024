<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLink - Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .content-container {
            padding-top: 100px;
            padding-left: 150px;
            padding-right: 150px;
            margin-bottom: 30px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            position: relative;
            margin-bottom: 30px;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            background-color: var(--primary-color);
            border-radius: 50%;
            background-image: url('images/default-avatar.png');
            background-size: cover;
            background-position: center;
            border: 1px solid #D9D9D9;
            margin-right: 30px;
        }
        .username {
            font-family: 'Limelight', sans-serif;
            font-size: 30px;
            color: var(--text-color);
            flex-grow: 1;
        }
        .button-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: absolute;
            right: 0;
        }
        .edit-button {
            padding: 10px 20px;
            background-color: var(--text-color);
            color: var(--background-color);
            font-size: 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .add-list-button {
            padding: 10px 20px;
            background-color: var(--primary-color);
            border: 2px solid var(--text-color);
            color: var(--text-color);
            font-size: 22px;
            border-radius: 10px;
            cursor: pointer;
            display: block;
        }
        .section-title {
            font-family: 'Limelight', sans-serif;
            font-size: 24px;
            color: var(--text-color);
            margin-top: 30px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--text-color);
            padding-bottom: 10px;
        }
        .top-films {
            display: flex;
            gap: 19px;
            margin-bottom: 30px;
        }
        .film-poster {
            width: 213px;
            height: 318px;
            background-color: var(--primary-color);
            border-radius: 10px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            cursor: pointer;
        }
        .lists-carousel {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
            scroll-behavior: smooth;
            justify-content: flex-start;
            margin-bottom: 20px;
        }
        .list-item {
            width: 270px;
            height: 170px;
            background-color: var(--primary-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 30px;
            text-decoration: none;
            color: var(--text-color);
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <header>
        <img src="images/smalllogo.png" alt="CineLink Logo" class="logo">
        <form class="search-form" role="search" aria-label="Search movies">
            <input type="text" id="searchInput" name="searchInput" class="search-input" placeholder="search" aria-label="Search input">
            <button type="submit" id="searchButton" name="searchButton" class="search-button" aria-label="Submit search">
                <svg class="search-icon">
                    <use href="icons.svg#icon-search"></use>
                </svg>                
            </button>
        </form>
        <div class="nav-links" role="navigation" aria-label="Main navigation">
            <a href="main.html" class="nav-link active" aria-label="Go to main page">main</a>
            <a href="friends.html" class="nav-link" aria-label="Go to friends page">friends</a>
            <a href="profile.html" class="nav-link" aria-label="Go to profile page">profile</a>
            <svg id="logoutIcon" class="logout-icon" role="button" tabindex="0" aria-label="Log out">
                <use href="icons.svg#icon-logout"></use>
            </svg>                       
        </div>
    </header>
    
    <div class="content-container profile-content" role="main" aria-labelledby="username">
        <div class="profile-header">
            <div id="avatar" class="profile-avatar" aria-label="Profile avatar"></div>
            <p id="username" class="username" tabindex="0">Default User</p>
            <div class="button-section">
                <button class="edit-button" onclick="window.location.href='edit-profile.html'" aria-label="Edit profile">edit profile</button>
                <button id="addListButton" class="add-list-button" aria-label="Add new list">+ add list</button>
            </div>
        </div>

        <div class="section-title" id="topFilmsTitle">TOP-5 films</div>
        <div id="favorites" class="top-films" role="list" aria-labelledby="topFilmsTitle"></div>

        <div class="section-title" id="yourListsTitle">your lists</div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div id="listsCarousel" class="lists-carousel" role="list" aria-labelledby="yourListsTitle"></div>
        </div>
    </div>

    <script>
        async function loadProfile() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                alert('You need to log in.');
                window.location.href = 'login.html';
                return;
            }

            try {
                const userResponse = await fetch(`${LOCAL_SERVER_URL}/users/${userId}`);
                if (!userResponse.ok) {
                    throw new Error(`Failed to load profile: ${userResponse.status}`);
                }
                const user = await userResponse.json();

                document.getElementById('username').textContent = user.username || 'Default User';

                const favoritesContainer = document.getElementById('favorites');
                favoritesContainer.innerHTML = '';

                if (user.favorites && user.favorites.length > 0) {
                    for (const imdbID of user.favorites.slice(0, 5)) {
                        const movieResponse = await fetch(`https://www.omdbapi.com/?apikey=${API_KEY}&i=${imdbID}`);
                        if (!movieResponse.ok) {
                            console.warn(`Failed to load movie with ID ${imdbID}: ${movieResponse.status}`);
                            continue;
                        }
                        const movie = await movieResponse.json();

                        const moviePoster = document.createElement('div');
                        moviePoster.classList.add('film-poster');
                        moviePoster.style.backgroundImage = `url(${movie.Poster !== 'N/A' ? movie.Poster : 'images/default-poster.png'})`;
                        moviePoster.title = movie.Title;
                        moviePoster.addEventListener('click', () => {
                            window.location.href = `movie.html?imdbID=${imdbID}`;
                        });

                        favoritesContainer.appendChild(moviePoster);
                    }
                } else {
                    favoritesContainer.textContent = 'No favorite films added yet.';
                }

                const listsCarousel = document.getElementById('listsCarousel');
                listsCarousel.innerHTML = '';
                const listsResponse = await fetch(`${LOCAL_SERVER_URL}/lists?userId=${userId}`);
                if (!listsResponse.ok) {
                    throw new Error(`Failed to load lists: ${listsResponse.status}`);
                }
                const lists = await listsResponse.json();

                lists.forEach(list => {
                    const listItem = document.createElement('div');
                    listItem.classList.add('list-item');
                    listItem.textContent = list.name;
                    listItem.setAttribute('role', 'listitem');
                    listItem.addEventListener('click', () => {
                        window.location.href = `list.html?listId=${list.id}`;
                    });
                    listsCarousel.appendChild(listItem);
                });

                const addListButton = document.getElementById('addListButton');
                if (addListButton) {
                    addListButton.addEventListener('click', async () => {
                        const newListName = prompt('Enter the name of the new list:');
                        if (newListName) {
                            try {
                                const newList = {
                                    id: Math.random().toString(16).slice(2),
                                    userId: userId,
                                    name: newListName,
                                    movies: []
                                };

                                const response = await fetch(`${LOCAL_SERVER_URL}/lists`, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify(newList)
                                });

                                if (response.ok) {
                                    const listItem = document.createElement('div');
                                    listItem.classList.add('list-item');
                                    listItem.textContent = newListName;
                                    listItem.setAttribute('role', 'listitem');
                                    listsCarousel.appendChild(listItem);
                                } else {
                                    throw new Error(`Failed to add list: ${response.status}`);
                                }
                            } catch (error) {
                                console.error('Error adding list:', error);
                                alert('Failed to add list. Please try again.');
                            }
                        }
                    });
                } else {
                    console.warn('Add List button not found in the DOM.');
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                alert('Failed to load profile. Please try again later.');
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>    
    <script src="js/scripts.js"></script>
    <script src="js/theme_switcher.js"></script>
</body>
</html>
