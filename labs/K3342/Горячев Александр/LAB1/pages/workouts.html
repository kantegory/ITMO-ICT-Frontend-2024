<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск тренировок - FitLife</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/main.css" rel="stylesheet">
    <link href="../css/dashboard.css" rel="stylesheet">
    <link href="../css/auth.css" rel="stylesheet">
</head>
<body>
    <div id="header"></div>

    <div class="container">
        <h2 class="text-center mb-4">Поиск тренировок</h2>
        <div class="mb-3">
            <label for="filterLevel" class="form-label">Уровень подготовки</label>
            <select id="filterLevel" class="form-select">
                <option value="">Все</option>
                <option value="beginner">Начинающий</option>
                <option value="intermediate">Средний</option>
                <option value="advanced">Продвинутый</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="filterType" class="form-label">Тип тренировки</label>
            <select id="filterType" class="form-select">
                <option value="">Все</option>
                <option value="strength">Силовая</option>
                <option value="cardio">Кардио</option>
                <option value="flexibility">Гибкость</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="filterDuration" class="form-label">Длительность (мин)</label>
            <input type="number" id="filterDuration" class="form-control" placeholder="Введите длительность">
        </div>
        <button id="searchButton" class="btn btn-primary">Поиск</button>

        <div id="workoutResults" class="mt-4">
            <h3>Доступные тренировки</h3>
            <ul class="list-group" id="workoutList"></ul>
        </div>
        <div class="mt-4">
            <a href="dashboard.html" class="btn btn-secondary">К панели управления</a>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/workout.js"></script>
</body>
</html>
